<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#F1F3F8"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Тренажёр аккредитации</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: one 600px study column like a stack of exam cards; sticky progress bar on top, action bar pinned to the thumb zone */
:root{
  --paper:#F1F3F8; --card:#FFFFFF; --ink:#141C33; --ink-2:#525D78; --ink-3:#8790A6; --line:#DBE0EA; --line-2:#C9D0DE;
  --accent:#2445CC; --accent-soft:#E3E8FA; --on-accent:#FFFFFF;
  --mark:#FFE24A; --mark-ink:#1C1800;
  --good:#127A48; --good-bg:#E0F2E7; --bad:#BF342C; --bad-bg:#FBE5E3; --warn:#8A5D00; --warn-bg:#FFF3D1;
  --p1:#2445CC; --p2:#D4490F; --p3:#7A3CC2;
  --lv-new:#D5DBE6; --lv-bad:#E58A83; --lv-1:#F0C45E; --lv-2:#97C766; --lv-3:#22915A;
  --shadow:0 1px 2px rgba(20,28,51,.05),0 6px 18px rgba(20,28,51,.06);
  --f-display:"Unbounded","Onest",system-ui,sans-serif;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1322; --card:#161D31; --ink:#E7EBF5; --ink-2:#A1ABC4; --ink-3:#6E7894; --line:#273049; --line-2:#36405C;
    --accent:#8299FF; --accent-soft:#1F2A4D; --on-accent:#0E1322;
    --mark:#EED445; --mark-ink:#191500;
    --good:#55CF8F; --good-bg:#11301F; --bad:#FF8A80; --bad-bg:#3A191B; --warn:#F2C35B; --warn-bg:#352A10;
    --p1:#8299FF; --p2:#FF8F5A; --p3:#C39BFF;
    --lv-new:#2D3652; --lv-bad:#B5544E; --lv-1:#C99B2E; --lv-2:#6E9F45; --lv-3:#3DBE7C;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1322; --card:#161D31; --ink:#E7EBF5; --ink-2:#A1ABC4; --ink-3:#6E7894; --line:#273049; --line-2:#36405C;
  --accent:#8299FF; --accent-soft:#1F2A4D; --on-accent:#0E1322;
  --mark:#EED445; --mark-ink:#191500;
  --good:#55CF8F; --good-bg:#11301F; --bad:#FF8A80; --bad-bg:#3A191B; --warn:#F2C35B; --warn-bg:#352A10;
  --p1:#8299FF; --p2:#FF8F5A; --p3:#C39BFF;
  --lv-new:#2D3652; --lv-bad:#B5544E; --lv-1:#C99B2E; --lv-2:#6E9F45; --lv-3:#3DBE7C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:10px}
.wrap{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 28px;display:flex;flex-direction:column;gap:18px;min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
mark.hl{background:var(--mark);color:var(--mark-ink);padding:.06em .32em;border-radius:.3em .15em .35em .2em;-webkit-box-decoration-break:clone;box-decoration-break:clone;font-weight:600}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.muted{color:var(--ink-2)}

/* hero */
.hero{display:flex;flex-direction:column;gap:8px;padding-top:6px}
.hero h1{font-family:var(--f-display);font-weight:700;font-size:clamp(25px,7.2vw,34px);line-height:1.1;letter-spacing:-.01em}
.hero h1 .hl{font-weight:700}
.lead{color:var(--ink-2);max-width:60ch}

/* progress */
.prog{display:flex;flex-direction:column;gap:12px}
.prog-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.big{font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.of{color:var(--ink-2);font-weight:500}
.prog-cap{color:var(--ink-2);font-size:14px}
.seg{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--lv-new);gap:2px}
.seg span{display:block;height:100%}
.seg.thin{height:7px;gap:1px}
.c-new{background:var(--lv-new)} .c-bad{background:var(--lv-bad)} .c-1{background:var(--lv-1)} .c-2{background:var(--lv-2)} .c-3{background:var(--lv-3)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--ink-2)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:0}
.topics{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.trow{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px}
.trow .seg{grid-column:1/-1}
.trow b{font-weight:600}
.trow .n{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}

/* actions */
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.act{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;min-height:92px;transition:transform .12s ease,border-color .12s ease}
.act:active{transform:scale(.985)}
.act:not(:disabled):hover{border-color:var(--line-2)}
.act-t{font-weight:700;font-size:17px}
.act-s{font-size:13px;color:var(--ink-2);line-height:1.35}
.act.main{grid-column:1/-1;background:var(--accent);border-color:var(--accent);color:var(--on-accent);min-height:0;padding:18px 16px;flex-direction:row;align-items:center;justify-content:space-between;gap:12px}
.act.main .act-t{font-family:var(--f-display);font-size:20px;font-weight:700}
.act.main .act-s{color:inherit;opacity:.85}
.act.main .go{flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.18)}
.act:disabled{opacity:.5}
.act .cnt{font-family:var(--f-mono);font-size:12px;background:var(--bad-bg);color:var(--bad);padding:1px 7px;border-radius:99px}
.resume{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--accent-soft);border:1px dashed var(--accent);color:var(--ink);border-radius:14px;padding:12px 14px;text-align:left}
.resume b{color:var(--accent)}

/* settings */
.settings{display:flex;flex-direction:column;gap:12px}
.settings h2{font-size:15px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line-2);background:transparent;border-radius:99px;padding:7px 12px;font-size:14px;font-weight:500;color:var(--ink-2)}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.segctl{display:grid;grid-template-columns:repeat(3,1fr);background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.segctl button{border:0;background:transparent;border-radius:9px;padding:9px 6px;font-size:14px;font-weight:600;color:var(--ink-2)}
.segctl button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.note{font-size:13px;color:var(--ink-2)}
.foot{display:flex;flex-direction:column;gap:10px;font-size:13px;color:var(--ink-2);padding-bottom:8px}
.linkbtn{background:none;border:0;padding:0;color:var(--bad);text-decoration:underline;text-underline-offset:3px;font-size:13px;align-self:flex-start}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sync{display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3);flex:none}
.dot.on{background:var(--good)}

/* card session */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-left,0px)) 10px;display:flex;flex-direction:column;gap:8px}
.top-row{display:flex;align-items:center;gap:10px}
.iconbtn{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);flex:none}
.top-mid{flex:1;min-width:0;display:flex;flex-direction:column}
.top-mid b{font-size:15px}
.top-mid span{font-size:12px;color:var(--ink-2);font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s ease}
.qmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.03em;padding:3px 8px;border-radius:7px;background:var(--card);border:1px solid var(--line);color:var(--ink-2)}
.tag.k{background:var(--accent-soft);border-color:transparent;color:var(--ink)}
.qtext{font-size:19px;font-weight:600;line-height:1.38;max-width:62ch}
.task{font-size:14px;color:var(--ink-2);margin-top:-6px}
.hint{display:flex;gap:10px;align-items:flex-start;background:var(--warn-bg);color:var(--ink);border-radius:14px;padding:12px 14px;font-size:15px}
.hint svg{flex:none;color:var(--warn);margin-top:2px}
.mask{font-family:var(--f-mono);letter-spacing:.12em;font-size:16px;color:var(--warn);margin-top:6px;word-break:break-word}

.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;font-size:16px;font-weight:500;line-height:1.35;transition:border-color .12s ease,background .12s ease}
.opt:not(:disabled):hover{border-color:var(--line-2)}
.opt .ltr{flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:9px;background:var(--paper);font-family:var(--f-mono);font-size:13px;color:var(--ink-2)}
.opt .tx{flex:1;min-width:0}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.right .ltr{background:var(--good);color:var(--card)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .ltr{background:var(--bad);color:var(--card)}
.opt.dim{opacity:.55}
.chain{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px;font-size:14.5px}
.chain li{display:flex;gap:8px}
.chain li span{font-family:var(--f-mono);font-size:12px;color:var(--ink-3);padding-top:2px;flex:none;width:16px}

.typein{display:flex;flex-direction:column;gap:8px}
.typein input{width:100%;font:inherit;font-size:18px;padding:14px 15px;border-radius:14px;border:1.5px solid var(--line-2);background:var(--card);color:var(--ink)}
.typein input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.typein input.right{border-color:var(--good);background:var(--good-bg)}
.typein input.wrong{border-color:var(--bad);background:var(--bad-bg);text-decoration:line-through;text-decoration-color:var(--bad)}
.typein .note{padding-left:2px}
.shake{animation:shake .3s ease}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* matching */
.sub{font-size:12px;font-family:var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:-6px}
.ml-list,.mr-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.ml,.mr{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px;font-size:15px;line-height:1.38}
.ml .tx,.mr .tx{flex:1;min-width:0}
.ml.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.pn{flex:none;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;color:var(--card);font-family:var(--f-mono);font-size:13px;font-weight:500}
.pn.p0{background:var(--p1)} .pn.p1{background:var(--p2)} .pn.p2{background:var(--p3)} .pn.p3{background:var(--ink-2)}
.slot{flex:none;min-width:30px;height:26px;display:grid;place-items:center;border-radius:8px;border:1.5px dashed var(--line-2);font-family:var(--f-mono);font-size:13px;color:var(--ink-3)}
.slot.full{border-style:solid;border-color:var(--ink-2);color:var(--ink)}
.mr .ltr{flex:none;display:grid;place-items:center;width:26px;height:26px;border-radius:8px;background:var(--paper);font-family:var(--f-mono);font-size:13px;color:var(--ink-2)}
.mr.used{background:var(--paper)}
.mr .tags{display:flex;gap:4px;flex:none}
.mres{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.mres li{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px}
.mres li.ok{border-color:var(--good)}
.mres li.no{border-color:var(--bad)}
.mres .l{font-weight:600}
.mres .yours{font-size:14px;color:var(--bad);text-decoration:line-through;text-decoration-color:var(--bad)}
.mres .r{display:flex;gap:8px;align-items:flex-start}
.mres .r svg{flex:none;margin-top:3px}
.mres .ok-i{color:var(--good)} .mres .no-i{color:var(--bad)}
.memo-s{font-size:14px;color:var(--ink-2);display:flex;gap:7px;align-items:flex-start}
.memo-s svg{flex:none;color:var(--warn);margin-top:1px}

/* ordering */
.o-seq,.o-pool{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.ob{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px;font-size:15px;line-height:1.38}
.ob .tx{flex:1;min-width:0}
.ob .num{flex:none;display:grid;place-items:center;width:26px;height:26px;border-radius:8px;background:var(--accent);color:var(--on-accent);font-family:var(--f-mono);font-size:13px}
.ob .x{flex:none;color:var(--ink-3)}
.o-empty{border:1.5px dashed var(--line-2);border-radius:14px;padding:12px;display:flex;gap:10px;align-items:center;color:var(--ink-3);font-size:14px}
.o-empty .num{flex:none;display:grid;place-items:center;width:26px;height:26px;border-radius:8px;border:1.5px dashed var(--line-2);font-family:var(--f-mono);font-size:13px}
.o-pool .ob .plus{flex:none;display:grid;place-items:center;width:26px;height:26px;border-radius:8px;background:var(--paper);color:var(--ink-2);font-size:18px;line-height:1}
.ores{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.ores li{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:11px 12px;font-size:15px}
.ores li.ok{border-color:var(--good)} .ores li.no{border-color:var(--bad)}
.ores .num{flex:none;display:grid;place-items:center;width:26px;height:26px;border-radius:8px;background:var(--mark);color:var(--mark-ink);font-family:var(--f-mono);font-size:13px;font-weight:500}
.ores .tx{flex:1;min-width:0}
.ores .st{flex:none;margin-top:3px}
.ores .ok-i{color:var(--good)} .ores .no-i{color:var(--bad)}
.yourorder{font-size:13.5px;color:var(--ink-2)}

/* feedback */
.fb{display:flex;flex-direction:column;gap:12px;border-radius:16px;padding:14px;background:var(--card);border:1px solid var(--line);animation:pop .22s ease}
@keyframes pop{from{transform:translateY(6px);opacity:.4}to{transform:none;opacity:1}}
.fb-h{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px}
.fb-h .ic{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;color:var(--card)}
.fb.good .fb-h .ic{background:var(--good)} .fb.good .fb-h{color:var(--good)}
.fb.bad .fb-h .ic{background:var(--bad)} .fb.bad .fb-h{color:var(--bad)}
.fb-ans{font-size:17px;line-height:1.5}
.fb-ans small{display:block;font-size:13px;color:var(--ink-2);margin-bottom:2px}
.yours{font-size:14px;color:var(--ink-2)}
.yours s{color:var(--bad)}
.memo{display:flex;gap:10px;align-items:flex-start;background:var(--warn-bg);border-radius:12px;padding:12px;font-size:15px;line-height:1.45}
.memo svg{flex:none;color:var(--warn);margin-top:2px}
.memo-k{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--warn);margin-bottom:3px}
.override{align-self:flex-start;background:none;border:1px solid var(--line-2);border-radius:10px;padding:7px 11px;font-size:13.5px;color:var(--ink-2)}

/* action bar */
.spacer{flex:1}
.abar{position:sticky;bottom:0;z-index:5;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:12px max(16px,env(safe-area-inset-left,0px)) calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to bottom,transparent,var(--paper) 30%);display:flex;gap:8px;align-items:stretch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:52px;border-radius:14px;padding:0 16px;font-weight:700;font-size:16px;border:1.5px solid var(--line-2);background:var(--card);color:var(--ink)}
.btn.pri{flex:1;background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-size:17px}
.btn.pri:disabled{opacity:.45}
.btn.ghost{padding:0 12px;font-weight:600;font-size:14.5px;color:var(--ink-2);white-space:nowrap}
.btn.ghost.on{border-color:var(--warn);color:var(--warn)}
.btn:active:not(:disabled){transform:scale(.98)}

/* results */
.score{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.score .big{font-size:56px}
.score .pct{font-family:var(--f-mono);font-size:14px;color:var(--ink-2)}
.rlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.rlist li{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14.5px}
.rlist .st{flex:none;display:grid;place-items:center;width:22px;height:22px;border-radius:50%;color:var(--card);margin-top:1px}
.rlist .st.ok{background:var(--good)} .rlist .st.no{background:var(--bad)}
.rlist .tx{flex:1;min-width:0}
.rlist .num{font-family:var(--f-mono);font-size:12px;color:var(--ink-3)}
h2.sec{font-family:var(--f-display);font-weight:500;font-size:18px}
.btnrow{display:flex;flex-direction:column;gap:8px}

/* cheat sheet */
.listhead{display:flex;flex-direction:column;gap:12px}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--line-2);border-radius:14px;padding:0 12px}
.search svg{flex:none;color:var(--ink-3)}
.search input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:16px;padding:12px 0;color:var(--ink);outline:none}
.search:focus-within{border-color:var(--accent)}
.toggle{display:flex;align-items:center;gap:10px;font-size:14.5px;color:var(--ink-2)}
.toggle input{width:20px;height:20px;accent-color:var(--accent)}

    rref = ref; S.sync = 'cloud';
    if (push){ rDirty = true; flushRemote(); }
    softRender();
  } catch(e){ /* stays on this device */ }
}

/* ---------- Progress model (Leitner boxes 0..5) ---------- */
function lvl(id){
  const p = S.prog[id];
  if (!p) return 'new';
  if (p.b >= 3) return '3';
  if (p.b === 2) return '2';
  if (p.b === 1) return '1';
  return p.w > 0 ? 'bad' : 'new';
}
const LV_NAME = {new:'новый', bad:'ошибка', '1':'знаком', '2':'почти', '3':'выучено'};
function stats(ids){ const s = {new:0, bad:0, '1':0, '2':0, '3':0}; ids.forEach(id => s[lvl(id)]++); s.n = ids.length; return s; }
function mistakes(){ return Q.filter(q => lvl(q.id) === 'bad').map(q => q.id); }
function record(id, ok, hinted){
  const p = Object.assign({b:0, c:0, w:0, t:0}, S.prog[id]);
  if (ok){ p.c++; if (!hinted) p.b = Math.min(5, p.b + 1); }
  else { p.w++; p.b = 0; }
  p.t = Date.now();
  S.prog[id] = p;
  save();
}

/* ---------- Sessions ---------- */
function prio(id){
  const p = S.prog[id];
  if (!p) return 1;
  if (p.b === 0) return p.w > 0 ? 0 : 1;
  return 1 + p.b;
}
function startLearn(ids){
  if (!ids){
    const pool = shuffle(Q.filter(q => S.set.topics.includes(q.t)).map(q => q.id));
    pool.sort((a, b) => prio(a) - prio(b) || ((S.prog[a] && S.prog[a].t) || 0) - ((S.prog[b] && S.prog[b].t) || 0));
    ids = pool.slice(0, LEARN_N);
  }
  S.sess = {kind:'learn', ids:ids.slice(), queue:ids.slice(), first:{}, passed:{}, res:{}, done:false};
  S.view = 'card'; nextCard();
}
function startExam(){
  const ids = shuffle(Q.map(q => q.id)).slice(0, EXAM_N);
  S.sess = {kind:'exam', ids:ids.slice(), queue:ids.slice(), first:{}, passed:{}, res:{}, done:false};
  S.view = 'card'; nextCard();
}
function modeFor(q, exam){
  const pref = S.set.mode, p = S.prog[q.id], known = p && p.b >= 1;
  if (q.k === 'match') return 'match';
  if (q.k === 'order'){
    if (!q.wrong) return 'order';
    if (pref === 'choice') return 'chain';
    if (pref === 'type') return 'order';
    if (exam) return Math.random() < .5 ? 'chain' : 'order';
    return known ? 'order' : 'chain';
  }
  if (pref === 'choice') return 'choice';
  if (pref === 'type') return 'type';
  if (exam) return Math.random() < .5 ? 'choice' : 'type';
  return known ? 'type' : 'choice';
}
function makeCard(id){
  const q = QBY[id], exam = S.sess.kind === 'exam';
  const c = {id, mode:modeFor(q, exam), hint:0, answered:false, ok:null, verdict:'', given:'', picked:null, typed:'', fresh:true};
  if (c.mode === 'choice') c.opts = shuffle([q.a].concat(shuffle(q.d).slice(0, 3)));
  if (c.mode === 'chain') c.chains = shuffle([0, 1, 2]); // 0 = correct chain, 1..2 = q.wrong[i-1]
  if (c.mode === 'match'){ c.L = shuffle(q.pairs.map((_, i) => i)); c.R = shuffle(q.pairs.map((_, i) => i)); c.asg = {}; c.act = 0; }
  if (c.mode === 'order'){ c.pool = shuffle(q.steps.map((_, i) => i)); if (c.pool.every((v, i) => v === i)) c.pool.reverse(); c.seq = []; }
  return c;
}
function nextCard(){
  const s = S.sess;
  if (!s.queue.length){ s.done = true; S.cur = null; S.view = 'result'; render(); scrollTop(); return; }
  const id = s.queue.shift();
  S.cur = makeCard(id);
  render(); scrollTop();
  if (S.cur.mode === 'type'){ const inp = document.getElementById('ans'); if (inp) try { inp.focus({preventScroll:true}); } catch(e){} }
}
function finalize(ok, given, verdict){
  const c = S.cur, s = S.sess, q = QBY[c.id];
  c.answered = true; c.ok = ok; c.given = given; c.verdict = verdict || (ok ? 'exact' : 'wrong');
  const firstTime = !(c.id in s.first);
  if (firstTime){
    c.prev = S.prog[c.id] ? Object.assign({}, S.prog[c.id]) : null;
    s.first[c.id] = ok;
    s.res[c.id] = {ok, given, mode:c.mode};
    record(c.id, ok, c.hint > 0);
  }
  c.recorded = firstTime;
  if (ok) s.passed[c.id] = true;
  if (s.kind === 'learn' && !ok){ s.queue.splice(Math.min(3, s.queue.length), 0, c.id); c.requeued = true; }
  if (s.kind === 'exam'){ nextCard(); return; }
  render();
  requestAnimationFrame(() => { const fb = document.querySelector('.fb'); if (fb && fb.scrollIntoView) fb.scrollIntoView({block:'nearest', behavior:'smooth'}); });
}
function overrideCorrect(){
  const c = S.cur, s = S.sess;
  if (!c || !c.answered || c.ok) return;
  if (c.recorded){
    if (c.prev) S.prog[c.id] = c.prev; else delete S.prog[c.id];
    s.first[c.id] = true; s.res[c.id] = {ok:true, given:c.given, mode:c.mode};
    record(c.id, true, c.hint > 0);
  }
  if (c.requeued){ const i = s.queue.indexOf(c.id); if (i >= 0) s.queue.splice(i, 1); c.requeued = false; }
  s.passed[c.id] = true;
  c.ok = true; c.verdict = 'override';
  render();
}

}

    <div class="topics">${Object.keys(TOPICS).map(t => { const ids = Q.filter(q => q.t === t).map(q => q.id), st = stats(ids); return `<div class="trow"><b>${esc(TOPICS[t].name)}</b><span class="n">${st['3']}/${st.n}</span>${segbar(st, true)}</div>`; }).join('')}</div>

function vTop(){
  const s = S.sess, total = s.ids.length;
  const done = s.kind === 'exam' ? Object.keys(s.res).length : Object.keys(s.passed).length;
  const label = s.kind === 'exam' ? `Вопрос ${Math.min(done + 1, total)} из ${total}` : `Усвоено ${done} из ${total}`;
  return `<div class="top"><div class="top-row">
      <button class="iconbtn" data-act="home" aria-label="На главную">${I.x}</button>
      <div class="top-mid"><b>${s.kind === 'exam' ? 'Экзамен' : 'Учить'}</b><span>${label}</span></div>
    </div><div class="bar"><i style="width:${(done / total * 100).toFixed(1)}%"></i></div></div>`;
}
function taskLine(c){
  return {choice:'Выбери ответ', type:'Впиши ответ', chain:'Выбери правильную цепочку', match:'Сопоставь: нажми на пункт слева, потом на его пару', order:'Нажимай шаги по порядку, от первого к последнему'}[c.mode];
}
function vCard(){
  const c = S.cur, q = QBY[c.id], s = S.sess, learn = s.kind === 'learn';
  let body = '';
  if (c.mode === 'choice') body = vChoice(c, q);
  else if (c.mode === 'type') body = vType(c, q);
  else if (c.mode === 'chain') body = vChain(c, q);
  else if (c.mode === 'match') body = c.answered ? vMatchResult(c, q) : vMatch(c, q);
  else body = c.answered ? vOrderResult(c, q) : vOrder(c, q);
  const hint = (!c.answered && c.hint > 0) ? `<div class="hint">${I.lamp}<div>${esc(q.clue)}${c.hint > 1 && q.k === 'term' ? `<div class="mask">${esc(mask(q.a))}</div>` : ''}</div></div>` : '';
  return `${vTop()}
    <div class="qmeta"><span class="tag">№ ${esc(q.id)}</span><span class="tag k">${KIND[q.k]}</span><span class="tag">${esc(TOPICS[q.t].name)}</span></div>
    <p class="qtext">${esc(q.q)}</p>
    ${c.answered ? '' : `<p class="task">${taskLine(c)}</p>`}
    ${hint}
    ${body}
    ${c.answered && learn ? vFeedback(c, q) : ''}
    <div class="spacer"></div>
    ${vActions(c, q, learn)}`;
}
function vChoice(c, q){
  return `<div class="opts">${c.opts.map((o, i) => {
    let cls = '';
    if (c.answered){ if (o === q.a) cls = 'right'; else if (i === c.picked) cls = 'wrong'; else cls = 'dim'; }
    else if (i === c.picked) cls = 'sel';
    return `<button class="opt ${cls}" data-act="pick" data-i="${i}" ${c.answered ? 'disabled' : ''}><span class="ltr">${LETTERS[i]}</span><span class="tx">${esc(o)}</span></button>`;
  }).join('')}</div>`;
}
function chainSteps(q, ci){ return ci === 0 ? q.steps : q.wrong[ci - 1]; }
function vChain(c, q){
  return `<div class="opts">${c.chains.map((ci, i) => {
    let cls = '';
    if (c.answered){ if (ci === 0) cls = 'right'; else if (i === c.picked) cls = 'wrong'; else cls = 'dim'; }
    else if (i === c.picked) cls = 'sel';
    return `<button class="opt ${cls}" data-act="pick" data-i="${i}" ${c.answered ? 'disabled' : ''} style="align-items:flex-start"><span class="ltr">${LETTERS[i]}</span><ol class="chain tx">${chainSteps(q, ci).map((st, k) => `<li><span>${k + 1}</span>${esc(st)}</li>`).join('')}</ol></button>`;
  }).join('')}</div>`;
}
function vType(c, q){
  const cls = c.answered ? (c.ok ? 'right' : 'wrong') : '';
  return `<form class="typein" data-form="type" autocomplete="off">
    <input id="ans" class="${cls}" type="text" inputmode="text" autocomplete="off" autocorrect="off" autocapitalize="sentences" spellcheck="false" enterkeyhint="done" placeholder="Твой ответ" value="${esc(c.typed)}" ${c.answered ? 'disabled' : ''} aria-label="Ответ">
    ${c.answered ? '' : '<span class="note">Регистр, «ё» и небольшие опечатки не важны</span>'}
  </form>`;
}
function vMatch(c, q){
  const usedBy = {}; Object.keys(c.asg).forEach(lp => { usedBy[c.asg[lp]] = +lp; });
  return `<div class="sub">Пункты</div>
  <ol class="ml-list">${c.L.map((pi, lp) => {
    const a = c.asg[lp];
    return `<li><button class="ml${c.act === lp ? ' on' : ''}" data-act="ml" data-i="${lp}" aria-pressed="${c.act === lp}"><span class="pn p${lp}">${lp + 1}</span><span class="tx">${esc(q.pairs[pi][0])}</span><span class="slot${a != null ? ' full' : ''}">${a != null ? LETTERS[a] : '?'}</span></button></li>`;
  }).join('')}</ol>
  <div class="sub">Пары для пункта ${c.act + 1}</div>
  <ul class="mr-list">${c.R.map((pi, rp) => {
    const lp = usedBy[rp];
    return `<li><button class="mr${lp != null ? ' used' : ''}" data-act="mr" data-j="${rp}"><span class="ltr">${LETTERS[rp]}</span><span class="tx">${esc(q.pairs[pi][1])}</span>${lp != null ? `<span class="pn p${lp}">${lp + 1}</span>` : ''}</button></li>`;
  }).join('')}</ul>`;
}
function vMatchResult(c, q){
  return `<ul class="mres">${c.L.map((pi, lp) => {
    const a = c.asg[lp], chosen = a != null ? c.R[a] : null, ok = chosen === pi;
    return `<li class="${ok ? 'ok' : 'no'}">
      <span class="l">${esc(q.pairs[pi][0])}</span>
      ${!ok && chosen != null ? `<span class="yours">${esc(q.pairs[chosen][1])}</span>` : ''}
      <span class="r"><span class="${ok ? 'ok-i' : 'no-i'}">${ok ? I.ok : I.no}</span><span><mark class="hl">${esc(q.pairs[pi][1])}</mark></span></span>
      <span class="memo-s">${I.lamp}<span>${esc(q.pairs[pi][2])}</span></span>
    </li>`;
  }).join('')}</ul>`;
}
function vOrder(c, q){
  const n = q.steps.length;
  const seq = c.seq.map((si, pos) => `<li><button class="ob" data-act="ou" data-i="${pos}" aria-label="Убрать шаг ${pos + 1}"><span class="num">${pos + 1}</span><span class="tx">${esc(q.steps[si])}</span><span class="x">${I.x}</span></button></li>`).join('');
  const empties = Array.from({length: n - c.seq.length}, (_, k) => `<li class="o-empty"><span class="num">${c.seq.length + k + 1}</span>${k === 0 ? 'нажми шаг ниже' : ''}</li>`).join('');
  const pool = c.pool.filter(si => !c.seq.includes(si)).map(si => `<li><button class="ob" data-act="op" data-i="${si}"><span class="plus">+</span><span class="tx">${esc(q.steps[si])}</span></button></li>`).join('');
  return `<div class="sub">Твой порядок</div><ol class="o-seq">${seq}${empties}</ol>
    ${pool ? `<div class="sub">Шаги</div><ul class="o-pool">${pool}</ul>` : ''}`;
}
function vOrderResult(c, q){
  const yours = c.seq.map(si => si + 1);
  return `<ol class="ores">${q.steps.map((st, i) => {
    const ok = c.seq[i] === i;
    return `<li class="${ok ? 'ok' : 'no'}"><span class="num">${i + 1}</span><span class="tx">${esc(st)}</span><span class="st ${ok ? 'ok-i' : 'no-i'}">${ok ? I.ok : I.no}</span></li>`;
  }).join('')}</ol>
  ${!c.ok && yours.length ? `<p class="yourorder">Твой порядок: ${yours.join(' → ')} (номера шагов из правильного списка выше)</p>` : ''}`;
}
function vFeedback(c, q){
  const good = c.ok;
  const head = good
    ? ({exact: c.hint ? 'Верно, но с подсказкой' : 'Верно', alt:'Засчитано', typo:'Засчитано, есть опечатка', override:'Засчитано вручную'}[c.verdict] || 'Верно')
    : (c.verdict === 'skip' ? 'Запоминаем ответ' : 'Неверно');
  let ans = '';
  if (q.k === 'term'){
    const note = (c.verdict === 'alt' || c.verdict === 'typo') ? '<small>В ключе написано так:</small>' : '<small>Ответ</small>';
    ans = `<div class="fb-ans">${note}<mark class="hl">${esc(q.a)}</mark></div>`;
    if (c.mode === 'type' && !good && c.given && c.verdict !== 'skip') ans += `<div class="yours">Твой ответ: <s>${esc(c.given)}</s></div><button class="override" data-act="override">Мой ответ тоже верный, засчитать</button>`;
  }
  const memo = q.k === 'match' ? `<div class="memo">${I.lamp}<div><div class="memo-k">Как запомнить</div>${esc(q.clue)}</div></div>`
    : `<div class="memo">${I.lamp}<div><div class="memo-k">Как запомнить</div>${esc(q.memo)}</div></div>`;
  const again = !good ? `<p class="note">Этот вопрос вернётся через пару карточек.</p>` : '';
  return `<section class="fb ${good ? 'good' : 'bad'}">
    <div class="fb-h" role="status"><span class="ic">${good ? I.ok : I.no}</span>${head}</div>
    ${ans}${memo}${again}
  </section>`;
}
function vActions(c, q, learn){
  if (c.answered) return `<div class="abar"><button class="btn pri" data-act="next">Дальше ${I.go}</button></div>`;
  const hintBtn = learn ? `<button class="btn ghost${c.hint ? ' on' : ''}" data-act="hint" aria-label="Подсказка">${I.lamp}${c.hint && q.k === 'term' && c.mode === 'type' && c.hint < 2 ? 'Ещё' : 'Подсказка'}</button>` : '';
  const skip = `<button class="btn ghost" data-act="skip">Не знаю</button>`;
  if (c.mode === 'choice' || c.mode === 'chain'){
    if (learn) return `<div class="abar">${hintBtn}${skip}</div>`;
    return `<div class="abar">${skip}<button class="btn pri" data-act="submit" ${c.picked == null ? 'disabled' : ''}>Ответить</button></div>`;
  }
  if (c.mode === 'type') return `<div class="abar">${hintBtn}${skip}<button class="btn pri" data-act="submit">Проверить</button></div>`;
  const ready = c.mode === 'match' ? Object.keys(c.asg).length === q.pairs.length : c.seq.length === q.steps.length;
  return `<div class="abar">${hintBtn}${skip}<button class="btn pri" data-act="submit" ${ready ? '' : 'disabled'}>${learn ? 'Проверить' : 'Ответить'}</button></div>`;
}

function answerHtml(q, withMemo){
  if (q.k === 'term') return `<p class="ans"><mark class="hl">${esc(q.a)}</mark></p>${withMemo ? `<div class="memo">${I.lamp}<div><div class="memo-k">Как запомнить</div>${esc(q.memo)}</div></div>` : ''}`;
  if (q.k === 'match') return `<ul class="pairs">${q.pairs.map(p => `<li><span class="pl">${esc(p[0])}</span><span class="pr"><mark class="hl">${esc(p[1])}</mark></span>${withMemo ? `<span class="memo-s">${I.lamp}<span>${esc(p[2])}</span></span>` : ''}</li>`).join('')}</ul>`;
  return `<ol class="steps">${q.steps.map(s => `<li>${esc(s)}</li>`).join('')}</ol>${withMemo ? `<div class="memo">${I.lamp}<div><div class="memo-k">Как запомнить</div>${esc(q.memo)}</div></div>` : ''}<span class="key">в ключе: ${esc(q.key)}</span>`;
}
function shortAns(q){ return q.k === 'term' ? q.a : q.k === 'match' ? 'Соответствие: ' + q.pairs.map(p => p[0]).join(' / ') : 'Последовательность: ' + q.steps[0] + ' → …'; }

function vResult(){
  const s = S.sess, ids = s.ids, okN = ids.filter(id => s.first[id]).length;
  if (s.kind === 'exam'){
    const pct = Math.round(okN / ids.length * 100), wrong = ids.filter(id => !s.first[id]);
    return `<div class="backrow"><button class="iconbtn" data-act="home" aria-label="На главную">${I.back}</button><span class="eyebrow">Экзамен завершён</span></div>
      <section class="panel score">
        <div><span class="big">${okN}</span><span class="of"> / ${ids.length}</span></div>
        <div class="bar" style="width:100%;height:10px"><i style="width:${pct}%"></i></div>
        <span class="pct">${pct}% верно · ошибок: ${wrong.length}</span>
      </section>
      ${wrong.length ? `<div class="btnrow"><button class="btn pri" data-act="fix">Проработать ${wrong.length} ${plural(wrong.length,'ошибку','ошибки','ошибок')}</button></div>
      <h2 class="sec">Разбор ошибок</h2>
      <div class="items">${wrong.map(id => { const q = QBY[id], r = s.res[id]; return `<article class="item">
        <div class="qmeta"><span class="tag">№ ${esc(q.id)}</span><span class="tag k">${KIND[q.k]}</span></div>
        <p class="q">${esc(q.q)}</p>
        ${r && r.given ? `<p class="yours">Твой ответ: <s>${esc(r.given)}</s></p>` : ''}
        ${answerHtml(q, true)}</article>`; }).join('')}</div>` : '<p class="empty">Ни одной ошибки. Так держать.</p>'}
      <div class="btnrow"><button class="btn" data-act="exam">Новый экзамен</button><button class="btn" data-act="home">На главную</button></div>`;
  }
  return `<div class="backrow"><button class="iconbtn" data-act="home" aria-label="На главную">${I.back}</button><span class="eyebrow">Подход завершён</span></div>
    <section class="panel score">
      <div><span class="big">${okN}</span><span class="of"> из ${ids.length} с первого раза</span></div>
      <span class="pct">Вопросы с ошибками попадут в «Ошибки» и придут первыми в следующем подходе.</span>
    </section>
    <ul class="rlist">${ids.map(id => { const q = QBY[id], ok = s.first[id]; return `<li><span class="st ${ok ? 'ok' : 'no'}">${ok ? I.ok : I.no}</span><span class="tx"><span class="num">№ ${esc(q.id)}</span> ${esc(shortAns(q))}</span></li>`; }).join('')}</ul>
    <div class="btnrow"><button class="btn pri" data-act="learn">Ещё подход ${I.go}</button><button class="btn" data-act="home">На главную</button></div>`;
}

function vList(){
  return `<div class="backrow"><button class="iconbtn" data-act="home" aria-label="На главную">${I.back}</button><h1>Шпаргалка</h1></div>
  <div class="listhead">
    <label class="search">${I.search}<input id="lq" type="search" placeholder="Поиск по вопросам и ответам" value="${esc(S.listQ)}" autocomplete="off" aria-label="Поиск"></label>
    <div class="chips">${[['all','Все']].concat(Object.keys(TOPICS).map(t => [t, TOPICS[t].name])).map(t => `<button class="chip${S.listT === t[0] ? ' on' : ''}" data-act="ltopic" data-t="${t[0]}">${esc(t[1])}</button>`).join('')}</div>
    <label class="toggle"><input id="hide" type="checkbox" ${S.hideAns ? 'checked' : ''}> Закрыть ответы (проверь себя, потом открой)</label>
  </div>
  <div class="items" id="items">${vItems()}</div>`;
}
function vItems(){
  const nq = norm(S.listQ);
  const list = Q.filter(q => (S.listT === 'all' || q.t === S.listT) && (!nq || norm(q.q + ' ' + JSON.stringify(q.a || q.pairs || q.steps)).includes(nq)));
  if (!list.length) return `<p class="empty">Ничего не нашлось. Попробуй другое слово.</p>`;
  return list.map(q => {
    const lv = lvl(q.id), open = !S.hideAns || S.shown[q.id];
    return `<article class="item">
      <div class="qmeta"><span class="tag">№ ${esc(q.id)}</span><span class="tag k">${KIND[q.k]}</span><span class="lv l-${lv}">${LV_NAME[lv]}</span></div>
      <p class="q">${esc(q.q)}</p>
      ${open ? answerHtml(q, true) : `<button class="reveal" data-act="reveal" data-id="${esc(q.id)}">Показать ответ</button>`}
    </article>`;
  }).join('');
}

/* ---------- Render ---------- */
const app = document.getElementById('app');
function render(){
  let html = '';
  if (S.view === 'card' && S.cur) html = vCard();
  else if (S.view === 'result' && S.sess) html = vResult();
  else if (S.view === 'list') html = vList();
  else { S.view = 'home'; html = vHome(); }
  app.innerHTML = html;
}
function softRender(){ if (S.view === 'home') render(); }
function scrollTop(){ try { window.scrollTo(0, 0); } catch(e){} }

/* ---------- Events ---------- */
app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const act = b.dataset.act, c = S.cur, q = c && QBY[c.id], learn = S.sess && S.sess.kind === 'learn';
  switch (act){
    case 'learn': startLearn(); break;
    case 'exam': startExam(); break;
    case 'mist': startLearn(shuffle(mistakes()).slice(0, 20)); break;
    case 'fix': { const s = S.sess; startLearn(s.ids.filter(id => !s.first[id])); break; }
    case 'list': S.view = 'list'; render(); scrollTop(); break;
    case 'home': S.view = 'home'; S.confirmReset = false; render(); scrollTop(); break;
    case 'resume': S.view = 'card'; render(); scrollTop(); break;
    case 'topic': {
      const t = b.dataset.t, on = S.set.topics.includes(t);
      if (on && S.set.topics.length === 1) break;
      S.set.topics = on ? S.set.topics.filter(x => x !== t) : S.set.topics.concat(t);
      save(); render(); break;
    }
    case 'mode': S.set.mode = b.dataset.m; save(); render(); break;
    case 'reset': S.confirmReset = true; render(); break;
    case 'reset-no': S.confirmReset = false; render(); break;
    case 'reset-yes': S.prog = {}; S.sess = null; S.cur = null; S.confirmReset = false; save(); render(); break;
    case 'ltopic': S.listT = b.dataset.t; render(); break;
    case 'reveal': S.shown[b.dataset.id] = true; document.getElementById('items').innerHTML = vItems(); break;
    case 'hint': {
      if (!c || c.answered) break;
      c.hint = Math.min(c.hint + 1, (q.k === 'term' && c.mode === 'type') ? 2 : 1);
      render();
      const inp = document.getElementById('ans'); if (inp) try { inp.focus({preventScroll:true}); } catch(err){}
      break;
    }
    case 'skip': if (!c || c.answered) break; finalize(false, '', 'skip'); break;
    case 'pick': {
      if (!c || c.answered) break;
      c.picked = +b.dataset.i;
      if (learn) submit(); else render();
      break;
    }
    case 'submit': submit(); break;
    case 'next': nextCard(); break;
    case 'override': overrideCorrect(); break;
    case 'ml': if (c && !c.answered){ c.act = +b.dataset.i; render(); } break;
    case 'mr': {
      if (!c || c.answered) break;
      const rp = +b.dataset.j;
      Object.keys(c.asg).forEach(lp => { if (c.asg[lp] === rp) delete c.asg[lp]; });
      c.asg[c.act] = rp;
      const n = c.L.length;
      for (let k = 1; k <= n; k++){ const lp = (c.act + k) % n; if (c.asg[lp] == null){ c.act = lp; break; } }
      render(); break;
    }
    case 'op': if (c && !c.answered){ c.seq.push(+b.dataset.i); render(); } break;
    case 'ou': if (c && !c.answered){ c.seq.splice(+b.dataset.i, 1); render(); } break;
  }
});
function submit(){
  const c = S.cur; if (!c || c.answered) return;
  const q = QBY[c.id];
  if (c.mode === 'choice'){ if (c.picked == null) return; const o = c.opts[c.picked]; finalize(o === q.a, o); return; }
  if (c.mode === 'chain'){ if (c.picked == null) return; const ci = c.chains[c.picked]; finalize(ci === 0, chainSteps(q, ci).join(' → ')); return; }
  if (c.mode === 'type'){
    const inp = document.getElementById('ans'); if (inp) c.typed = inp.value;
    const r = checkTyped(q, c.typed);
    if (r.kind === 'empty'){ if (inp){ inp.classList.remove('shake'); void inp.offsetWidth; inp.classList.add('shake'); inp.focus(); } return; }
    finalize(r.ok, c.typed.trim(), r.kind); return;
  }
  if (c.mode === 'match'){
    if (Object.keys(c.asg).length < q.pairs.length) return;
    const ok = c.L.every((pi, lp) => c.R[c.asg[lp]] === pi);
    finalize(ok, c.L.map((pi, lp) => q.pairs[pi][0] + ' → ' + q.pairs[c.R[c.asg[lp]]][1]).join('; '));
    return;
  }
  if (c.mode === 'order'){
    if (c.seq.length < q.steps.length) return;
    finalize(c.seq.every((si, i) => si === i), c.seq.map(si => q.steps[si]).join(' → '));
  }
}
app.addEventListener('input', e => {
  if (e.target.id === 'ans' && S.cur) S.cur.typed = e.target.value;
  if (e.target.id === 'lq'){ S.listQ = e.target.value; document.getElementById('items').innerHTML = vItems(); }
});
app.addEventListener('change', e => {
  if (e.target.id === 'hide'){ S.hideAns = e.target.checked; S.shown = {}; document.getElementById('items').innerHTML = vItems(); }
});
app.addEventListener('submit', e => { e.preventDefault(); if (e.target.dataset.form === 'type') submit(); });
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || S.view !== 'card' || !S.cur) return;
  if (S.cur.answered && !(e.target && e.target.closest && e.target.closest('button'))){ e.preventDefault(); nextCard(); }
});

/* ---------- Boot ---------- */
function start(data){
  loadLocal();
  if (data && data.sess && data.cur && QBY[data.cur.id]){
    try { S.sess = data.sess; S.cur = data.cur; S.view = data.view || 'card'; } catch(e){ S.sess = null; S.cur = null; S.view = 'home'; }
  }
  render();
  connect();
}
const hot = window.claude && window.claude.hot;
if (hot && hot.snapshot) try { hot.snapshot(() => ({sess:S.sess, cur:S.cur, view:S.view})); } catch(e){}
if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
</body></html>
